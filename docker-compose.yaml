services:
  db_selftest:
    image: postgres:13.22-alpine3.21
    container_name: pg-selftest
    restart: unless-stopped
    ports:
      - "5434:5432"         
    environment:
      POSTGRES_USER: usertest
      POSTGRES_PASSWORD: passwtest
      POSTGRES_DB: selftest_db
    volumes:
      - pg-selftest:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin_selftest
    depends_on:
      - db_selftest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  pg-selftest:
